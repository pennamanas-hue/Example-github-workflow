
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Explorer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle, #17264b, #030711);
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    text-align: center;
}

header {
    padding: 30px 15px;
}

h1 {
    font-size: 42px;
    color: #ffd166;
}

header p {
    color: #b5c5df;
    margin-top: 10px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 35px;
    padding: 20px;
}

.solar-system {
    width: 600px;
    height: 600px;
    max-width: 95vw;
    max-height: 95vw;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.sun {
    width: 65px;
    height: 65px;
    background: orange;
    border-radius: 50%;
    box-shadow: 0 0 40px yellow;
    animation: glow 3s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 20px orange; }
    to { box-shadow: 0 0 65px yellow; }
}

.orbit {
    position: absolute;
    border: 1px solid #ffffff35;
    border-radius: 50%;
    animation: rotate linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.planet {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    cursor: pointer;
}

.mercury {
    width: 10px;
    height: 10px;
    background: gray;
}

.venus {
    width: 16px;
    height: 16px;
    background: orange;
}

.earth {
    width: 19px;
    height: 19px;
    background: #1686ff;
    box-shadow: 0 0 10px #1686ff;
}

.mars {
    width: 14px;
    height: 14px;
    background: red;
}

.jupiter {
    width: 35px;
    height: 35px;
    background: #c58b58;
}

.saturn {
    width: 30px;
    height: 30px;
    background: #e4c58c;
}

.uranus {
    width: 22px;
    height: 22px;
    background: lightblue;
}

.neptune {
    width: 21px;
    height: 21px;
    background: blue;
}

.info {
    width: 300px;
    padding: 25px;
    background: #142344;
    border: 1px solid #40577e;
    border-radius: 20px;
}

.info h2 {
    color: #ffd166;
    margin-bottom: 15px;
}

.info p {
    line-height: 1.6;
    color: #d1dbea;
}

button {
    margin-top: 18px;
    padding: 10px 18px;
    background: #ffd166;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: orange;
}

.controls {
    margin-top: 20px;
}

@media(max-width: 650px) {
    .solar-system {
        transform: scale(.85);
        margin: -35px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🌌 Solar System Explorer</h1>
    <p>Explore the eight planets revolving around the Sun!</p>
</header>

<div class="container">

<div class="solar-system">

    <div class="sun"></div>

    <div class="orbit"
         style="width:110px;height:110px;animation-duration:9s">
        <div class="planet mercury"
             onclick="showPlanet('Mercury')"></div>
    </div>

    <div class="orbit"
         style="width:160px;height:160px;animation-duration:14s">
        <div class="planet venus"
             onclick="showPlanet('Venus')"></div>
    </div>

    <div class="orbit"
         style="width:210px;height:210px;animation-duration:19s">
        <div class="planet earth"
             onclick="showPlanet('Earth')"></div>
    </div>

    <div class="orbit"
         style="width:260px;height:260px;animation-duration:25s">
        <div class="planet mars"
             onclick="showPlanet('Mars')"></div>
    </div>

    <div class="orbit"
         style="width:350px;height:350px;animation-duration:35s">
        <div class="planet jupiter"
             onclick="showPlanet('Jupiter')"></div>
    </div>

    <div class="orbit"
         style="width:440px;height:440px;animation-duration:45s">
        <div class="planet saturn"
             onclick="showPlanet('Saturn')"></div>
    </div>

    <div class="orbit"
         style="width:520px;height:520px;animation-duration:55s">
        <div class="planet uranus"
             onclick="showPlanet('Uranus')"></div>
    </div>

    <div class="orbit"
         style="width:590px;height:590px;animation-duration:65s">
        <div class="planet neptune"
             onclick="showPlanet('Neptune')"></div>
    </div>

</div>

<div class="info">
    <h2 id="name">Earth 🌍</h2>

    <p id="description">
        Earth is our home planet.
        It supports life and has liquid water.
    </p>

    <div class="controls">
        <button onclick="pauseAnimation()">
            Pause / Resume
        </button>

        <button onclick="resetSystem()">
            Reset
        </button>
    </div>
</div>

</div>

<script>

const planets = {

    Mercury: "Mercury is the smallest planet and closest to the Sun.",

    Venus: "Venus is the hottest planet in our solar system.",

    Earth: "Earth is our home planet. It supports life and has liquid water.",

    Mars: "Mars is known as the Red Planet.",

    Jupiter: "Jupiter is the largest planet in our solar system.",

    Saturn: "Saturn is famous for its beautiful rings.",

    Uranus: "Uranus is an ice giant that rotates on its side.",

    Neptune: "Neptune is the farthest planet from the Sun."

};

function showPlanet(planet) {

    document.getElementById("name").innerText = planet;

    document.getElementById("description").innerText =
        planets[planet];

}

let paused = false;

function pauseAnimation() {

    paused = !paused;

    document.querySelectorAll(".orbit").forEach(orbit => {

        orbit.style.animationPlayState =
            paused ? "paused" : "running";

    });

}

function resetSystem() {

    paused = false;

    document.querySelectorAll(".orbit").forEach(orbit => {

        orbit.style.animationPlayState = "running";

    });

    showPlanet("Earth");

}

</script>

</body>
</html>
